#
# ARM CMSIS-DAP compliant adapter
#
# http://www.keil.com/support/man/docs/dapdebug/
#
# Vendored from OpenOCD's stock scripts/interface/cmsis-dap.cfg (verbatim) so
# a specific probe's serial can be pinned here without touching the system
# copy. Only needed if you have more than one SWD probe attached.
#

adapter driver cmsis-dap

# Optionally specify the serial number of CMSIS-DAP usb device.
# adapter serial 02200201E6661E601B98E3B9
